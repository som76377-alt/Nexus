<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a16"><title>Nexus — Biology Pixel Bush</title>
<style>
:root{color-scheme:dark;--paper:#f0edda}*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 20px;background:radial-gradient(ellipse at 25% 20%,#293c2e,transparent 44%),#111a16;color:var(--paper);font-family:system-ui,sans-serif}
main{width:min(100%,390px)}.eyebrow{margin:0 0 18px 3px;color:#bac5ad;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.bio-button{position:relative;isolation:isolate;display:block;width:100%;min-height:258px;overflow:hidden;padding:174px 22px 22px;border:1px solid #627751;border-radius:12px;background:linear-gradient(140deg,#2b3e2e,#203126 52%,#18251e);color:var(--paper);text-align:left;box-shadow:0 5px 0 #0a100d,0 19px 38px #0006;cursor:pointer;transition:transform .18s,border-color .18s}
.bio-button:hover{border-color:#94aa6a;transform:translateY(-2px)}.bio-button:active{transform:translateY(1px)}.bio-button:focus-visible{outline:3px solid #efd08a;outline-offset:5px}
.plant-scene{position:absolute;top:-5px;left:-5px;width:220px;height:177px;pointer-events:none}
.bush-wind{transform-origin:16px 8px;animation:wind-sway 6s ease-in-out infinite}
.label,.subtitle{position:relative;z-index:2;display:block}.label{font-size:25px;font-weight:720;letter-spacing:-.035em}.subtitle{margin-top:8px;color:#c0ceb7;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.status{min-height:20px;margin:17px 3px 0;color:#d7c797;font-size:12px}.note{margin:20px 3px 0;max-width:36ch;color:#acb8aa;font-size:13px;line-height:1.8}
@keyframes wind-sway{0%,100%{transform:rotate(-.7deg) translateX(0)}30%{transform:rotate(.8deg) translateX(1px)}60%{transform:rotate(1.4deg) translateX(2px)}82%{transform:rotate(.2deg) translateX(.5px)}}
@media(max-width:360px){.bio-button{min-height:246px;padding:166px 18px 20px}.plant-scene{width:204px;height:164px}}
@media(prefers-reduced-motion:reduce){.bush-wind{animation:none}.bio-button{transition:none}}
</style></head>

<p class="eyebrow">Nexus · pixel garden study</p>
<button class="bio-button" id="biology" type="button" aria-pressed="false" aria-label="Biology — select subject">

</g></g></svg>
<span class="label">Biology</span><span class="subtitle">Explore the living world ↗</span></button>
<p class="status" id="status" aria-live="polite">The garden sways gently in the breeze.</p>
<p class="note">One continuous pixel-bush silhouette. Foliage patterns and tiny blossoms are painted into the canopy; the whole bush moves softly as one plant.</p>
</main>
<script>
(() => { const button=document.querySelector("#biology"); const status=document.querySelector("#status"); button.addEventListener("click",()=>{const selected=button.getAttribute("aria-pressed")==="true";button.setAttribute("aria-pressed",String(!selected));status.textContent=selected?"Biology unselected.":"Biology selected.";}); })();
</script></body></html>
