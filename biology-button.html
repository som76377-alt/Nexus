<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee9d9">
<title>NEXUS — Biology Pixel Button</title>
<style>
:root{color-scheme:light;--ink:#20251b;--paper:#eee9d9;--moss:#496d37;--moss-light:#83a94d}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#eee9d9;color:var(--ink);font-family:ui-monospace,"Courier New",monospace}
main{width:min(100%,440px)}
.caption{margin:0 0 13px 2px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#656a58}
.bio-button{position:relative;display:block;width:100%;height:180px;padding:0;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;image-rendering:pixelated;touch-action:manipulation}
.frame{position:absolute;inset:17px 10px 17px 13px;width:calc(100% - 23px);height:calc(100% - 34px);overflow:visible}
.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.title{position:absolute;left:35%;top:44%;transform:translateY(-50%);font-size:clamp(19px,5.3vw,25px);font-weight:900;letter-spacing:-.07em;white-space:nowrap;text-shadow:1px 1px 0 #eee9d9}
.arrow{display:inline-block;margin-left:5px;font-size:.88em}
.bio-button:focus-visible{outline:3px dashed #496d37;outline-offset:5px}
.bio-button:hover .plant{animation-duration:4.4s}
.plant{transform-origin:20px 18px;animation:wind 6.5s ease-in-out infinite}
.status{margin:12px 2px 0;min-height:18px;font-size:11px;line-height:1.6;color:#626753}
@keyframes wind{0%,100%{transform:translate(0,0) rotate(0deg)}35%{transform:translate(1px,1px) rotate(.6deg)}70%{transform:translate(2px,0) rotate(-.35deg)}}
@media(max-width:360px){.bio-button{height:160px}.title{left:34%;font-size:18px}}
@media(prefers-reduced-motion:reduce){.plant{animation:none}}
</style>
</head>
<body>
<main>
<p class="caption">Nexus / field guide 01</p>
<button class="bio-button" id="biology" type="button" aria-pressed="false" aria-label="Biology — open subject">

</g>
</g>
<!-- A tiny pixel worm follows the taper near the lower-right tip. -->
<path fill="#20251b" d="M270 151H280V156H285V166H280V171H275V166H270V161H265V156H270Z"/>
<path fill="#a65f4b" d="M270 151H280V156H285V161H280V166H275V161H270V156H265V156H270Z"/>
<path fill="#d18a68" d="M270 151H275V156H280V161H275V166H270V161H265V156H270Z"/>
<path fill="#20251b" d="M274 153H277V156H274Z"/>
</svg>
<span class="title">Biology<span class="arrow">→</span></span>
</button>
<p class="status" id="status" aria-live="polite">Field guide · Biology</p>
</main>
<script>
(() => {
 const button=document.querySelector("#biology"),status=document.querySelector("#status");
 button.addEventListener("click",()=>{const active=button.getAttribute("aria-pressed")==="true";button.setAttribute("aria-pressed",String(!active));status.textContent=active?"Field guide · Biology":"Selected · Biology";});
})();
</script>
</body>
</html>
