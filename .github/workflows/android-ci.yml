name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation run for a PR/branch; superseded commits do not
# need to consume another full Android SDK + Gradle build.
concurrency:
  group: nexus-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify unsigned release builds fail closed
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleRelease > "$RUNNER_TEMP/nexus-release-guard.log" 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -eq 0 ]; then
            echo "::error::An unsigned release APK was unexpectedly assembled."
            exit 1
          fi

          if ! grep -Fq "Release APKs must be signed with the permanent Nexus keystore" "$RUNNER_TEMP/nexus-release-guard.log"; then
            cat "$RUNNER_TEMP/nexus-release-guard.log"
            echo "::error::Release build failed for an unexpected reason; the fail-closed guard was not verified."
            exit 1
          fi

          echo "Unsigned release build correctly refused before producing an APK."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
