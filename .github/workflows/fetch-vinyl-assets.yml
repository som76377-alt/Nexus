name: Fetch vinyl player assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ui/real-vinyl-player
          fetch-depth: 0

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Download, convert, and verify assets
        run: bash scripts/fetch-vinyl-assets.sh

      - name: Commit and push the PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/vinyl_disc.png app/src/main/res/drawable-nodpi/tonearm.png
          if git diff --cached --quiet; then
            echo "The verified PNG assets are already up to date; no commit is needed."
            exit 0
          fi
          git commit -m "Replace corrupt vinyl player asset placeholders"
          git push origin HEAD:ui/real-vinyl-player
