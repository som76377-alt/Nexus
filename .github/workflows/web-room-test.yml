name: Nexus Web Room Test

on:
  push:
    branches: [main, feature/web-room-test-client, fix/room-sync-intent-diagnostics]
    paths:
      - "web-room-test/**"
      - ".github/workflows/web-room-test.yml"
      - "app/src/main/java/com/nexus/music/rooms/**"
      - "app/src/main/java/com/nexus/music/playback/**"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - "web-room-test/**"
      - ".github/workflows/web-room-test.yml"
      - "app/src/main/java/com/nexus/music/rooms/**"
      - "app/src/main/java/com/nexus/music/playback/**"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-room-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce immutable SPEC.md
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:SPEC.md" 2>/dev/null; then
            if ! git diff --quiet "${BASE_SHA}" "${GITHUB_SHA}" -- SPEC.md; then
              echo "::error::SPEC.md is owner-controlled and must not be changed by a pull request."
              git diff --stat "${BASE_SHA}" "${GITHUB_SHA}" -- SPEC.md
              exit 1
            fi
          else
            echo "SPEC.md bootstrap: base branch has no SPEC.md; initial addition is permitted."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nexus-web-room-test
          path: web-room-test/dist/**
          if-no-files-found: error
          retention-days: 14
