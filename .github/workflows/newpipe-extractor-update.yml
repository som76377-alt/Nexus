name: Check NewPipe Extractor updates

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Find latest NewPipe Extractor release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Update version catalog when newer
        id: bump
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^newpipe-extractor = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          if [ "$current" = "$VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path("gradle/libs.versions.toml")
          text = path.read_text()
          updated, count = re.subn(
              r'(?m)^newpipe-extractor = ".*"$',
              f'newpipe-extractor = "{sys.argv[1]}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find exactly one NewPipe Extractor version entry.")
          path.write_text(updated)
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open dependency update pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/newpipe-extractor-update
          delete-branch: false
          commit-message: "chore(deps): update NewPipe Extractor to ${{ steps.latest.outputs.version }}"
          title: "chore(deps): update NewPipe Extractor to ${{ steps.latest.outputs.version }}"
          body: |
            Automated dependency update proposal.

            - Source: TeamNewPipe/NewPipeExtractor latest published release
            - Version: ${{ steps.latest.outputs.version }}
            - No live YouTube tests are run by this workflow.
            - This PR is not auto-merged; normal Android CI and review are required.
