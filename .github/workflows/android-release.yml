name: Nexus Signed Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for signing validation (for example 0.1.7)"
        required: true
        default: "0.1.7"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and verify signed Nexus APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check signing secrets and decode key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          for name in NEXUS_KEYSTORE_BASE64 NEXUS_KEYSTORE_PASSWORD NEXUS_KEY_ALIAS NEXUS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          if ! printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-signing.jks"; then
            echo "::error::NEXUS_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/nexus-signing.jks" ]; then
            echo "::error::The decoded keystore file is empty."
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/nexus-signing.jks" -storepass "$NEXUS_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keytool-store-check.log" 2>&1; then
            echo "::error::NEXUS_KEYSTORE_PASSWORD is incorrect for the decoded keystore. Re-enter the keystore password from the local signing setup."
            sed -n '1,6p' "$RUNNER_TEMP/keytool-store-check.log"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/nexus-signing.jks" -storepass "$NEXUS_KEYSTORE_PASSWORD" -alias "$NEXUS_KEY_ALIAS" > "$RUNNER_TEMP/keytool-alias-check.log" 2>&1; then
            echo "::error::NEXUS_KEY_ALIAS was not found in the keystore. The expected alias from the local setup is nexus-upload."
            sed -n '1,6p' "$RUNNER_TEMP/keytool-alias-check.log"
            exit 1
          fi
          echo "Keystore password and alias verified."

          echo "Nexus signing key validation" > "$RUNNER_TEMP/nexus-key-check.txt"
          if ! jar --create --file "$RUNNER_TEMP/nexus-key-check.jar" -C "$RUNNER_TEMP" nexus-key-check.txt > "$RUNNER_TEMP/jar-check.log" 2>&1; then
            echo "::error::Could not create the temporary signing validation archive."
            cat "$RUNNER_TEMP/jar-check.log"
            exit 1
          fi

          if ! jarsigner -keystore "$RUNNER_TEMP/nexus-signing.jks" -storepass "$NEXUS_KEYSTORE_PASSWORD" -keypass "$NEXUS_KEY_PASSWORD" "$RUNNER_TEMP/nexus-key-check.jar" "$NEXUS_KEY_ALIAS" > "$RUNNER_TEMP/jarsigner-check.log" 2>&1; then
            echo "::error::NEXUS_KEY_PASSWORD does not unlock the private key for NEXUS_KEY_ALIAS. Re-enter the private-key password from the local signing setup; do not change the keystore or regenerate the key."
            sed -n '1,8p' "$RUNNER_TEMP/jarsigner-check.log"
            exit 1
          fi
          echo "Private-key password verified."

          echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus-signing.jks" >> "$GITHUB_ENV"
          echo "NEXUS_KEYSTORE_PASSWORD=$NEXUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUS_KEY_ALIAS=$NEXUS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUS_KEY_PASSWORD=$NEXUS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Derive Android version
        id: version
        env:
          RELEASE_TAG: "${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version || '0.1.7' }}"
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must use canonical MAJOR.MINOR.PATCH (example: 0.1.4)."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( ${#MAJOR} > 4 || ${#MINOR} > 3 || ${#PATCH} > 3 )); then
            echo "::error::Version components exceed the supported range."
            exit 1
          fi
          if (( 10#$MAJOR > 2100 || 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "::error::Version components exceed the supported range."
            exit 1
          fi
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Version is outside Android's supported versionCode range."
            exit 1
          fi
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: >
          ./gradlew --no-daemon --stacktrace
          -PnexusVersionName="${{ steps.version.outputs.version_name }}"
          -PnexusVersionCode="${{ steps.version.outputs.version_code }}"
          :app:assembleRelease

      - name: Verify APK signature, package version and checksum
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          CERT_INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")"
          echo "$CERT_INFO"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_INFO" | awk -F': ' '/certificate SHA-256 digest:/ { print tolower($2); exit }' | tr -d ':')"
          EXPECTED_CERT_SHA256="c8b263a4b2aecac65df71e6ee9f6e8ab47a33688a46a4cf0f4248506975d6e2b"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK was signed with a different certificate. Do not publish it; check the Nexus signing secrets."
            exit 1
          fi
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.nexus.music' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"
          cd app/build/outputs/apk/release
          cp app-release.apk nexus-release.apk
          sha256sum nexus-release.apk > nexus-release.apk.sha256
          sha256sum --check nexus-release.apk.sha256

      - name: Upload validation APK artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-signed-release-validation
          path: |
            app/build/outputs/apk/release/nexus-release.apk
            app/build/outputs/apk/release/nexus-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      # Publish only the verified APK. gh release upload --clobber also
      # handles rebuilding an already-published tag without an action-side lookup.
      - name: Publish GitHub Release with verified APK
        if: github.ref_type == 'tag' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v0.1.7'))
        env:
          GH_TOKEN: "${{ github.token }}"
        env:
          RELEASE_COMMIT_MESSAGE: "${{ github.event.head_commit.message }}"
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v0.1.7"
          fi
          APK="app/build/outputs/apk/release/nexus-release.apk"
          CHECKSUM="app/build/outputs/apk/release/nexus-release.apk.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --title "Nexus $TAG" --generate-notes
          fi

      # Optional instant notification. Enable after configuring Firebase:
      # repo variable NEXUS_FIREBASE_PUSH_ENABLED=true and secrets
      # NEXUS_FIREBASE_SERVICE_ACCOUNT + NEXUS_FIREBASE_PROJECT_ID.
      - name: Authenticate Firebase release notifier
        if: github.ref_type == 'tag' && vars.NEXUS_FIREBASE_PUSH_ENABLED == 'true'
        id: firebase-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.NEXUS_FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Notify Nexus devices about the new release
        if: github.ref_type == 'tag' && vars.NEXUS_FIREBASE_PUSH_ENABLED == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ secrets.NEXUS_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Firebase push is enabled but its service-account or project-ID secret is missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://fcm.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/messages:send" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary '{"message":{"topic":"nexus_updates","data":{"type":"nexus_release","tag":"'${GITHUB_REF_NAME}'"}}}'
