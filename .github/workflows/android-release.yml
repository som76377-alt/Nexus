name: Nexus Signed Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for signing validation (for example 0.1.1)"
        required: true
        default: "0.1.1"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and verify signed Nexus APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check signing secrets and decode key
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          for name in NEXUS_KEYSTORE_BASE64 NEXUS_KEYSTORE_PASSWORD NEXUS_KEY_ALIAS NEXUS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          if ! printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-signing.jks"; then
            echo "::error::NEXUS_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/nexus-signing.jks" ]; then
            echo "::error::The decoded keystore file is empty."
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/nexus-signing.jks" -storepass "$NEXUS_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keytool-store-check.log" 2>&1; then
            echo "::error::NEXUS_KEYSTORE_PASSWORD is incorrect for the decoded keystore. Re-enter the keystore password from the local signing setup."
            sed -n '1,6p' "$RUNNER_TEMP/keytool-store-check.log"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/nexus-signing.jks" -storepass "$NEXUS_KEYSTORE_PASSWORD" -alias "$NEXUS_KEY_ALIAS" > "$RUNNER_TEMP/keytool-alias-check.log" 2>&1; then
            echo "::error::NEXUS_KEY_ALIAS was not found in the keystore. The expected alias from the local setup is nexus-upload."
            sed -n '1,6p' "$RUNNER_TEMP/keytool-alias-check.log"
            exit 1
          fi
          echo "Keystore password and alias verified."

          echo "Nexus signing key validation" > "$RUNNER_TEMP/nexus-key-check.txt"
          if ! jar --create --file "$RUNNER_TEMP/nexus-key-check.jar" -C "$RUNNER_TEMP" nexus-key-check.txt > "$RUNNER_TEMP/jar-check.log" 2>&1; then
            echo "::error::Could not create the temporary signing validation archive."
            cat "$RUNNER_TEMP/jar-check.log"
            exit 1
          fi

          if ! jarsigner -keystore "$RUNNER_TEMP/nexus-signing.jks" -storepass "$NEXUS_KEYSTORE_PASSWORD" -keypass "$NEXUS_KEY_PASSWORD" "$RUNNER_TEMP/nexus-key-check.jar" "$NEXUS_KEY_ALIAS" > "$RUNNER_TEMP/jarsigner-check.log" 2>&1; then
            echo "::error::NEXUS_KEY_PASSWORD does not unlock the private key for NEXUS_KEY_ALIAS. Re-enter the private-key password from the local signing setup; do not change the keystore or regenerate the key."
            sed -n '1,8p' "$RUNNER_TEMP/jarsigner-check.log"
            exit 1
          fi
          echo "Private-key password verified."

          echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus-signing.jks" >> "$GITHUB_ENV"
          echo "NEXUS_KEYSTORE_PASSWORD=$NEXUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEXUS_KEY_ALIAS=$NEXUS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEXUS_KEY_PASSWORD=$NEXUS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Derive Android version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version || '0.1.1' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH (example: 0.1.1)."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error::Minor and patch version numbers must be below 1000."
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Version is outside Android's supported versionCode range."
            exit 1
          fi
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: >
          ./gradlew --no-daemon --stacktrace
          -PnexusVersionName="${{ steps.version.outputs.version_name }}"
          -PnexusVersionCode="${{ steps.version.outputs.version_code }}"
          :app:assembleRelease

      - name: Verify APK signature, package version and checksum
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.nexus.music' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"
          cd app/build/outputs/apk/release
          cp app-release.apk nexus-release.apk
          sha256sum nexus-release.apk > nexus-release.apk.sha256
          sha256sum --check nexus-release.apk.sha256

      - name: Upload validation APK artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-signed-release-validation
          path: |
            app/build/outputs/apk/release/nexus-release.apk
            app/build/outputs/apk/release/nexus-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK and checksum to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            app/build/outputs/apk/release/nexus-release.apk
            app/build/outputs/apk/release/nexus-release.apk.sha256
          fail_on_unmatched_files: true
